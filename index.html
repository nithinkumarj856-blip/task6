<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry Mart | Login</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <div class="container">

    <!-- Left Section: Illustration -->
    <div class="left-section">
      <img src="https://cdn3d.iconscout.com/3d/premium/thumb/lavadero-3d-icon-png-download-8530782.png" class="illustration">
    </div>

    <!-- Right Section: Login Form -->
    <div class="right-section">
      <div class="form-wrapper">
        <h1>Hello Again!</h1>
        <p class="subtitle">Welcome back! we missed you!</p>

        <form class="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Emailid@site.com" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" required>

          <a href="#" class="forgot-password">Forgot Password</a>

          <button type="submit" class="login-btn">Login</button>

          <p class="register-text">Not a member? <a href="#" class="register-link">Register Now</a></p>
        </form>
      </div>
    </div>

  </div>

</body>
</html>
